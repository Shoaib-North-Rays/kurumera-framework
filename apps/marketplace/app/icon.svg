<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 96 96">
  <!-- FAVICON. The site shipped none at all, so browsers drew a blank page icon
       in every tab and bookmark. Geometry duplicated from
       public/brand/kurumera-mark.svg and from the KurumeraLogo component in the
       admin frontend, which is the origin - keep all three in sync. A tab icon
       needs a ground: on a dark browser theme the dark facet of the mark
       disappears against it, so this variant sits on the brand green. -->
